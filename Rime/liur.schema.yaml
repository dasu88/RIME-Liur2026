#錯誤查看%TEMP%\rime.weasel
# Rime schema settings
# encoding: utf-8
#
schema:
  schema_id: liur
  name: 蝦米輸入法
  version: "20181227"
  author:
    - 制作人
  description: |
    蝦米-拼音-注音反查輸入法
  dependencies:
    - luna_pinyin
    - bopomofo_tw
    - liur_symbols

switches:
  - name: ascii_mode
    reset: 0
    # states: [ 中文, 英文 ]
  - name: full_shape
    # states: [ 半形, 全形 ]
  # 反查試不出來，暫時隱藏
  - name: liu_w2c
    reset: 0
    states: [ 正常 ,反查 ]
  - name: extended_charset
    states: [ 常用, 擴充字集 ]
    reset: 0
  - name: simplification
    states: [ 繁體, 简体 ]
  - name: zh_tw
    reset: 1

# 解決注音Enter上字 
editor:
  bindings:
    Return: confirm    

engine:
  processors:
    - ascii_composer
    - lua_processor@liu_symbols_number_processor     # 符號清單數字選字及字母變化形（必須在 recognizer 之前攔截 ` 鍵）     
    - recognizer
    - key_binder
    - speller
#    - punctuator
    - selector
    - navigator
    - express_editor
#    - fluency_editor	#  語句流
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@mkst
    - affix_segmentor@liurqry
    - affix_segmentor@pinyin
    - affix_segmentor@phonetic
    - affix_segmentor@symbols  # 符號清單必須在 abc_segmentor 之前，以支援 `A `a 字母變化形
#    - punct_segmentor
    - fallback_segmentor
  translators:
#    - echo_translator
#    - punct_translator
#    - script_translator
    - lua_translator@liu_symbols_hint  # 符號清單提示
    - lua_translator@date_translator  # 符號清單變體（`a 字母變體，`01 數字變體）
    - table_translator@mkst
    - table_translator@fixed
    - table_translator@liurqry
    - table_translator
    - script_translator@pinyin
    - script_translator@phonetic
    - table_translator@symbols

  filters:
    - simplifier
    - simplifier@liu_w2c	#無蝦米字碼反查
    - simplifier@zh_tw
    - uniquifier	#過濾重複的候選字，有可能來自繁簡轉換
    - reverse_lookup_filter@phonetic_reverse_lookup
    - lua_filter@liu_symbols_hint_filter	#符號清單提示處理（必須在所有 simplifier 之後，uniquifier 之前）    
    # - single_char_filter  #單字優先
    - uniquifier	#過濾重複的候選字（必須在所有 filter 之後）

# abc_segmentor:
  # extra_tags:
    # - liurqry

liu_w2c:
  opencc_config: liu_w2c.json
  option_name: liu_w2c
  show_in_comment: true
  tags: [ abc, pinyin, mkst, phonetic, symbols ]
  tips: all

zh_tw:	#只針對拼音及注音反查進行台灣用語轉換
  opencc_config: t2tw.json
  option_name: zh_tw
  tags: [ pinyin, phonetic ]

simplifier:
  tips: all	# 簡化字模式下提示對應的傳統漢字

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz[];',."
  delimiter: "`"
  algebra:
    - xform/^~(.*)$/$1
#為了加強造詞準確性，在字典中，以「~」前綴標記非標準拆字，再透過拼寫語法去除「~」後，送入辭典查詢

translator:
  dictionary: liur.extended
  db_class: tabledb
  enable_user_dict: false
  enable_sentence: false
  enable_encoder: false
  enable_charset_filter: true
  encode_commit_history: false
  max_phrase_length: 10
  enable_completion: true
  comment_format:
    - xform/^~(.+)$/>[$1]   #將提示碼改為較美觀的型式
  disable_user_dict_for_patterns:
    - "^[',.].*$"
  initial_quality: 1000

fixed:
  __include: /translator
  enable_encoder: true
  enable_user_dict: true
  initial_quality: 100

mkst:
  __include: /translator
  enable_sentence: true
  prefix: ';'
  tips: "〔造詞〕"
  tag: mkst
  initial_quality: 10

liurqry:
  __include: /translator
  prefix: ";;"
  suffix: "'"
  tips: 【反查讀音】
  closing_tips: 【蝦米】
  initial_quality: 300	# 調整該編譯器出字優先度
  tag: liurqry

pinyin:
  tag: pinyin
  dictionary: luna_pinyin
  prefix: "`"
# 漢語拼音輸入以「`」引導
  suffix: "'"
  preedit_format: &pinyin
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  tips: 【拼音】
  closing_tips: 【蝦米】
  initial_quality: 0.2	# 調整該編譯器出字優先度

phonetic:
  tag: phonetic
  prefix: "';"
  suffix: "'"
  dictionary: terra_pinyin
  prism: bopomofo_tw
  preedit_format:	#menu反查之輸入法 顯示
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"
  comment_format:	#menu 提示 字碼 顯示
    - "xlit|abcdefghijklmnopqrstuvwxyz[];',.|abcdefghijklmnopqrstuvwxyz[];',.|"
  tips: 【注音】
  closing_tips: 【蝦米】
  initial_quality: 1.1	# 調整該編譯器出字優先度

phonetic_reverse_lookup:
  tags: [ liurqry ]
  dictionary: terra_pinyin
  overwrite_comment: true  # 覆蓋其他提示
  comment_format:
    - "xform/e?r5$/er5/"
    - "xform/iu/iou/"
    - "xform/ui/uei/"
    - "xform/ong/ung/"
    - "xform/yi?/i/"
    - "xform/wu?/u/"
    - "xform/iu/v/"
    - "xform/([jqx])u/$1v/"
    - "xform/([iuv])n/$1en/"
    - "xform/zh/Z/"
    - "xform/ch/C/"
    - "xform/sh/S/"
    - "xform/ai/A/"
    - "xform/ei/I/"
    - "xform/ao/O/"
    - "xform/ou/U/"
    - "xform/ang/K/"
    - "xform/eng/G/"
    - "xform/an/M/"
    - "xform/en/N/"
    - "xform/er/R/"
    - "xform/eh/E/"
    - "xform/([iv])e/$1E/"
    - "xform/1//"
    - "xlit|bpmfdtnlgkhjqxZCSrzcsiuvaoeEAIOUMNKGR2345|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˊˇˋ˙|"
    - xform/ /} {/
    - xform/^/ {
    - xform/$/}/

punctuator:
#  import_preset: default
#  import_preset: alternative

key_binder:
  import_preset: default

recognizer:
  import_preset: default

  patterns:
    email: ^[a-z][-_.0-9a-z]*@.*$
    url: ^(www[.]|https?:|ftp:|mailto:).*$
    phonetic: "';[1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/6347-]*'?$" # 「-」為「ㄦ」，移到最後面，讓正則可正確抓取
# 注音反查引導鍵
    #pinyin: "`[a-z']*'?$"
    pinyin: "^;'[a-z0-9;,/<'-]*'?$"
# 漢語拼音輸入引導鍵
    mkst: "^;[a-z,.'`]*$"
#造詞引導
    liurqry: ";;[a-z']*'?$"
# 讀音反查引導鍵
    lua: "``[a-z0-9/:]*'?$"
    # 符號清單引導鍵（`）- 數字編碼或字母變體
# `a = 字母變體（Ⓐ ⓐ...），`01~`50 = 符號分類
# 數字編碼後的數字鍵用於選字，字母變體後的數字鍵也用於選字
# 允許結尾有 ` 以處理誤按情況（如 `01` 或 `a`）
# 必須以 ` 開頭，避免 ix` 這種誤按觸發符號清單
    symbols: "^`([0-9]{0,2}|[a-z])`?$"    
    
# 符號清單配置
# 注意：alphabet 只包含字母，數字輸入由 lua_processor@liu_symbols_number_processor 處理
# `a = 字母變體（Ⓐ ⓐ...），`01~`50 = 符號分類，`'1~`'50 = 數字變體（① ⓵...）
symbols:
  tag: symbols
  dictionary: liur_symbols
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  prefix: "`"
  alphabet: "abcdefghijklmnopqrstuvwxyz`"
  tips: "《符號清單》▸"
  closing_tips: ""
  initial_quality: 1
  comment_format:
    - xform/^/~/
  preedit_format:
    - xform/^00/[00]常用/
    - xform/^01/[01]一般/
    - xform/^02/[02]括號/
    - xform/^03/[03]引號/
    - xform/^04/[04]豎標/
    - xform/^05/[05]數學/
    - xform/^06/[06]單位/
    - xform/^07/[07]貨幣/
    - xform/^08/[08]分數/
    - xform/^09/[09]上標/
    - xform/^10/[10]下標/
    - xform/^11/[11]注音/
    - xform/^12/[12]拼音/
    - xform/^13/[13]音標/
    - xform/^14/[14]平假/
    - xform/^15/[15]片假/
    - xform/^16/[16]韓文/
    - xform/^17/[17]藏文/
    - xform/^18/[18]希臘/
    - xform/^19/[19]俄語/
    - xform/^20/[20]合字/
    - xform/^21/[21]部首/
    - xform/^22/[22]月份/
    - xform/^23/[23]日期/
    - xform/^24/[24]時間/
    - xform/^25/[25]性別/
    - xform/^26/[26]圈英/
    - xform/^27/[27]圈數/
    - xform/^28/[28]圈漢/
    - xform/^29/[29]圈日/
    - xform/^30/[30]圈韓/
    - xform/^31/[31]括英/
    - xform/^32/[32]括數/
    - xform/^33/[33]括漢/
    - xform/^34/[34]括韓/
    - xform/^35/[35]框英/
    - xform/^36/[36]框數/
    - xform/^37/[37]框漢/
    - xform/^38/[38]點數/
    - xform/^39/[39]羅馬/
    - xform/^40/[40]箭頭/
    - xform/^41/[41]線段/
    - xform/^42/[42]框線/
    - xform/^43/[43]圓形/
    - xform/^44/[44]三角/
    - xform/^45/[45]方形/
    - xform/^46/[46]星星/
    - xform/^47/[47]八卦/
    - xform/^48/[48]易經/
    - xform/^49/[49]音樂/
    - xform/^50/[50]圖案/
    - "xform/^`$/``/"
    # 字母變化形的 preedit 由 lua/liu_letter_variants.lua 處理